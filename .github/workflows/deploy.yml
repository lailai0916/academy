name: Deploy Academy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: academy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: academy_test
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academy -d academy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

      - name: Migrate, seed, and test
        env:
          ACADEMY_INTEGRATION_TEST: 'true'
          NODE_ENV: test
          DATABASE_URL: postgres://academy:academy_test@127.0.0.1:5432/academy_test
          APP_ORIGIN: http://localhost:5173
          AI_CONFIG_ENCRYPTION_KEY: integration-test-encryption-key-2026
          BOOTSTRAP_ADMIN_USERNAME: admin
          BOOTSTRAP_ADMIN_PASSWORD: LocalTestPassword-2026
        run: |
          npm run db:migrate
          npm run db:seed
          npm test

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload release and deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -rlptz --delete --no-o --no-g \
            --exclude .git/ \
            --exclude .agents/ \
            --exclude node_modules/ \
            --exclude .env \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "${SERVER_USER}@${SERVER_HOST}:/opt/academy/incoming/"
          ssh -i ~/.ssh/deploy_key "${SERVER_USER}@${SERVER_HOST}" sudo /usr/local/sbin/deploy-academy
