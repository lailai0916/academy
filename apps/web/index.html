<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f8" />
    <meta name="description" content="lailai's Academy — 面向高中生的个性化自学平台。" />
    <link rel="icon" href="/brand/favicon.ico" />
    <title>lailai's Academy</title>
    <script>
      (function () {
        var preference = 'system';
        try {
          var stored = localStorage.getItem('lailai.theme');
          if (stored === 'light' || stored === 'dark') preference = stored;
        } catch (_) {}
        var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var theme = preference === 'system' ? system : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = theme;

        function syncThemeColor() {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (!meta) return;
          meta.setAttribute(
            'content',
            document.documentElement.dataset.theme === 'dark' ? '#111214' : '#f6f6f8'
          );
        }

        syncThemeColor();
        new MutationObserver(syncThemeColor).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['data-theme'],
        });
      })();
    </script>
    <script
      defer
      src="https://analytics.lailai.one/script.js"
      data-website-id="ba6c7111-ecd7-4685-898e-cb381c962eee"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
